name = "tvbox-source-aggregator"
main = "src/cf-entry.ts"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "tvbox.vayfou.cn/*", zone_id = "97e830e9e49de1f421d28a26c7898701" }
]

[triggers]
crons = ["0 * * * *"]  # 每小时触发，实际执行频率由 Admin 设置的聚合间隔控制

[[kv_namespaces]]
binding = "KV"
id = "3b9dde7644e7442db180e0f9e2b30933"
preview_id = "3b9dde7644e7442db180e0f9e2b30933"

[vars]
SPEED_TIMEOUT_MS = "5000"   # 源地址延迟阈值（毫秒）
SITE_TIMEOUT_MS = "3000"    # 站点 API 延迟阈值（毫秒）
FETCH_TIMEOUT_MS = "5000"   # 抓取配置 JSON 超时（毫秒）
WORKER_BASE_URL = "https://tvbox.vayfou.cn"  # CF 边缘代理依赖此配置（JAR/MacCMS/直播源代理）
